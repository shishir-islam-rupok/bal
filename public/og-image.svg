<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">File Shift</title>
  <desc id="desc">Private browser-based image and media converter</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9f5ee"/>
      <stop offset="100%" stop-color="#efe7dc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(90 90)">
    <rect x="0" y="0" width="1000" height="450" rx="36" fill="#fffdf9" stroke="#e5ddce"/>
    <text x="70" y="170" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#5f5d59" letter-spacing="8">PRIVATE • LOCAL • FAST</text>
    <text x="70" y="275" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="700" fill="#1f1f1c">file</text>
    <text x="400" y="275" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="700" fill="#e05d35">shift</text>
    <text x="70" y="355" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#4e4d48">Convert JPG, PNG, MP4, MP3 and more in your browser.</text>
    <g transform="translate(760 110)">
      <rect x="0" y="0" width="150" height="150" rx="26" fill="#f0e3d8"/>
      <path d="M42 93 L75 60 L95 80 L131 44" fill="none" stroke="#e05d35" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="42" cy="93" r="11" fill="#e05d35"/>
      <circle cx="75" cy="60" r="11" fill="#e05d35"/>
      <circle cx="95" cy="80" r="11" fill="#e05d35"/>
      <circle cx="131" cy="44" r="11" fill="#e05d35"/>
    </g>
  </g>
</svg>
